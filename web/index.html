<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroDefect — ESP32 Edge QC Node</title>
  <style>
    /* Premium Industrial UI - Fully Self-Contained, zero dependencies */
    :root {
      --bg: #0c0f1d;
      --card-bg: #141a2e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --text-dim: #64748b;
      --ok: #00f5a0;
      --defect: #ff4444;
      --accent: #00d9f5;
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--ok), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    /* Decision Box styling with smooth state transitions */
    .status-panel {
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.02);
    }

    .status-panel.state-ok {
      border-color: rgba(0, 245, 160, 0.3);
      background: rgba(0, 245, 160, 0.04);
      box-shadow: 0 0 20px rgba(0, 245, 160, 0.05);
    }

    .status-panel.state-defect {
      border-color: rgba(255, 68, 68, 0.3);
      background: rgba(255, 68, 68, 0.04);
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.05);
    }

    .status-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .state-ok .status-title { color: var(--ok); }
    .state-defect .status-title { color: var(--defect); }

    .status-desc {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .state-defect .status-desc { color: #ffa726; }

    /* Progress bar for confidence */
    .progress-section {
      text-align: left;
      margin-bottom: 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .progress-bg {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--ok);
      border-radius: 3px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .state-defect .progress-fill {
      background: var(--defect);
    }

    /* Metric Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .metric-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .metric-val {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .metric-lbl {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .btn {
      background: linear-gradient(135deg, var(--ok), var(--accent));
      color: #0c0f1d;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 245, 160, 0.2);
      transition: all 0.2s ease;
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="card" id="qc-card">
    <h1>ZeroDefect</h1>
    <div class="subtitle">ESP32 Edge Inspection Node</div>

    <div class="status-panel" id="status-panel">
      <div class="status-title" id="status-title">STANDBY</div>
      <div class="status-desc" id="status-desc">No parts inspected yet</div>
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span>Confidence</span>
        <span id="conf-val">—</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="conf-bar"></div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="metric-val" id="metric-score">—</div>
        <div class="metric-lbl">Anomaly Score</div>
      </div>
      <div class="metric-box">
        <div class="metric-val" id="metric-count">0</div>
        <div class="metric-lbl">Total Checked</div>
      </div>
    </div>

    <button class="btn" id="btn-trigger">Trigger Inspection</button>
  </div>

  <div class="footer">
    Tata Technologies InnoVent 2026-27 | Track 3.2.3.4
  </div>

  <script>
    const card = document.getElementById('qc-card');
    const panel = document.getElementById('status-panel');
    const title = document.getElementById('status-title');
    const desc = document.getElementById('status-desc');
    const confVal = document.getElementById('conf-val');
    const confBar = document.getElementById('conf-bar');
    const mScore = document.getElementById('metric-score');
    const mCount = document.getElementById('metric-count');
    const btn = document.getElementById('btn-trigger');

    function updateUI(data) {
      const isDefect = data.decision === 'DEFECT';
      
      // Update status panel classes and content
      panel.className = `status-panel ${isDefect ? 'state-defect' : 'state-ok'}`;
      card.className = `card ${isDefect ? 'state-defect' : 'state-ok'}`;
      
      title.innerText = isDefect ? '✗ DEFECT' : '✓ OK';
      desc.innerText = isDefect ? `${data.defect_type || 'anomaly'}` : 'Part normal';
      
      // Update values
      mScore.innerText = data.score.toFixed(4);
      mCount.innerText = data.inspections_count || 0;
      
      const pct = Math.round(data.confidence * 100);
      confVal.innerText = `${pct}%`;
      confBar.style.width = `${pct}%`;
    }

    async function queryStatus() {
      try {
        const res = await fetch('/api/status');
        if (res.ok) {
          const data = await res.json();
          updateUI(data);
        }
      } catch (err) {
        console.warn("API Offline", err);
      }
    }

    btn.addEventListener('click', async () => {
      btn.innerText = 'Inspecting...';
      btn.disabled = true;
      try {
        const res = await fetch('/capture');
        if (res.ok) {
          const data = await res.json();
          updateUI(data);
        }
      } catch (err) {
        alert("Inference trigger failed. Check camera server.");
      } finally {
        btn.innerText = 'Trigger Inspection';
        btn.disabled = false;
      }
    });

    // Auto-refresh stats loop every 3 seconds
    setInterval(queryStatus, 3000);
  </script>
</body>
</html>
